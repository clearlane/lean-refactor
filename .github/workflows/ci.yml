name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install checks
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck shfmt bats
          python -m pip install check-jsonschema

      # The check list lives in scripts/check.sh so CI, README, and SKILL.md
      # cannot drift apart. --strict makes every optional checker mandatory.
      - name: Run repository checks
        run: bash scripts/check.sh --strict
